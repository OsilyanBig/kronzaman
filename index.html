<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桜 Kronometre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@300;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #f5f0e8;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(216,167,167,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(183,164,150,0.1) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Kağıt dokusu */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  canvas#sakuraCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 20px;
  }

  /* Üst kanji dekorasyon */
  .top-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    font-weight: 300;
    color: #b8a090;
    letter-spacing: 12px;
    text-transform: uppercase;
  }

  /* Ana kart */
  .card {
    background: rgba(255,252,247,0.85);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 48px 56px;
    box-shadow: 
      0 2px 40px rgba(139,115,95,0.08),
      0 0 0 1px rgba(139,115,95,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    overflow: hidden;
    min-width: 340px;
  }

  /* Kart üst çizgi - kırmızı accent */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 3px;
    background: linear-gradient(90deg, transparent, #c45c5c, transparent);
    border-radius: 0 0 4px 4px;
  }

  /* Enso daire */
  .enso-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg.enso-ring {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .enso-bg {
    fill: none;
    stroke: #e8e0d4;
    stroke-width: 3;
  }

  .enso-progress {
    fill: none;
    stroke: url(#sakuraGrad);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 660;
    stroke-dashoffset: 660;
    transition: stroke-dashoffset 0.3s ease;
  }

  /* Enso fırça efekti - dekoratif */
  .enso-brush {
    position: absolute;
    top: -8px; left: -8px;
    width: calc(100% + 16px);
    height: calc(100% + 16px);
    border-radius: 50%;
    border: 2px solid transparent;
    opacity: 0.06;
    border-top-color: #4a3728;
    border-right-color: #4a3728;
    border-bottom-color: transparent;
    border-left-color: transparent;
    transform: rotate(30deg);
  }

  .time-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .time-display {
    font-family: 'Noto Serif JP', serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: #3a322a;
    letter-spacing: 3px;
    line-height: 1;
  }

  .time-label {
    font-size: 0.6rem;
    color: #b8a090;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: #b8a090;
    background: rgba(184,160,144,0.08);
    transition: all 0.4s ease;
  }

  .status-badge .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #b8a090;
    transition: all 0.4s ease;
  }

  .status-badge.running { color: #8b9e6b; background: rgba(139,158,107,0.08); }
  .status-badge.running .dot { background: #8b9e6b; animation: softPulse 2s ease infinite; }
  .status-badge.paused { color: #c45c5c; background: rgba(196,92,92,0.06); }
  .status-badge.paused .dot { background: #c45c5c; }

  @keyframes softPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Butonlar */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 14px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-start {
    background: #3a322a;
    color: #f5f0e8;
  }
  .btn-start:hover {
    background: #4a4238;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(58,50,42,0.2);
  }

  .btn-pause {
    background: rgba(196,92,92,0.08);
    color: #c45c5c;
    border: 1px solid rgba(196,92,92,0.15);
  }
  .btn-pause:hover {
    background: rgba(196,92,92,0.14);
    transform: translateY(-1px);
  }

  .btn-lap {
    background: rgba(139,158,107,0.08);
    color: #7a8e5e;
    border: 1px solid rgba(139,158,107,0.15);
  }
  .btn-lap:hover {
    background: rgba(139,158,107,0.15);
    transform: translateY(-1px);
  }

  .btn-reset {
    background: rgba(184,160,144,0.08);
    color: #9e8e7e;
    border: 1px solid rgba(184,160,144,0.15);
  }
  .btn-reset:hover {
    background: rgba(184,160,144,0.15);
    transform: translateY(-1px);
  }

  .btn:active { transform: scale(0.96) !important; }

  /* Tur kayıtları */
  .laps-section {
    width: 100%;
    max-height: 180px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #d4ccc0 transparent;
  }

  .laps-section::-webkit-scrollbar { width: 3px; }
  .laps-section::-webkit-scrollbar-thumb { background: #d4ccc0; border-radius: 3px; }

  .lap-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(184,160,144,0.1);
    animation: fadeUp 0.4s ease;
  }

  .lap-item:last-child { border-bottom: none; }

  .lap-num {
    font-size: 0.6rem;
    color: #c4a88c;
    letter-spacing: 2px;
    min-width: 50px;
  }

  .lap-diff {
    font-size: 0.6rem;
    color: #b8a090;
    font-family: 'Noto Serif JP', serif;
  }

  .lap-time {
    font-size: 0.8rem;
    color: #5a4e42;
    font-family: 'Noto Serif JP', serif;
    font-weight: 500;
  }

  .lap-item.best .lap-time { color: #7a8e5e; }
  .lap-item.worst .lap-time { color: #c45c5c; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Alt dekorasyon */
  .bottom-deco {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.8rem;
    color: rgba(184,160,144,0.15);
    letter-spacing: 20px;
    user-select: none;
  }

  .shortcut-hint {
    font-size: 0.5rem;
    color: rgba(184,160,144,0.4);
    letter-spacing: 2px;
  }

  /* Separator çizgi */
  .sep {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c4a88c44, transparent);
  }

  @media (max-width: 480px) {
    .card { padding: 36px 28px; min-width: 300px; }
    .enso-wrap { width: 180px; height: 180px; }
    .time-display { font-size: 2.2rem; }
    .btn { padding: 10px 20px; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<canvas id="sakuraCanvas"></canvas>

<div class="container">
  <div class="top-kanji">勉強の時間</div>

  <div class="card">
    <div class="status-badge" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">hazır</span>
    </div>

    <div class="enso-wrap">
      <svg class="enso-ring" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d4a0a0"/>
            <stop offset="50%" style="stop-color:#c45c5c"/>
            <stop offset="100%" style="stop-color:#8b6b5e"/>
          </linearGradient>
        </defs>
        <circle class="enso-bg" cx="110" cy="110" r="105"/>
        <circle class="enso-progress" cx="110" cy="110" r="105"/>
      </svg>
      <div class="enso-brush"></div>
      <div class="time-inner">
        <div class="time-display" id="display">00:00</div>
        <div class="time-label" id="timeLabel">dakika : saniye</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">Başlat</button>
      <button class="btn btn-lap" id="btnLap" onclick="addLap()">Tur</button>
      <button class="btn btn-reset" onclick="resetTimer()">Sıfırla</button>
    </div>

    <div class="sep"></div>

    <div class="laps-section" id="lapsContainer"></div>
  </div>

  <div class="bottom-deco">桜 風 道</div>
  <div class="shortcut-hint">Space: Başlat / Durdur &nbsp;&nbsp; L: Tur &nbsp;&nbsp; R: Sıfırla</div>
</div>

<script>
  let startTime = 0, elapsed = 0, running = false, animFrame = null;
  let laps = [], lastLapTime = 0;

  const display = document.getElementById('display');
  const timeLabel = document.getElementById('timeLabel');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const btnStart = document.getElementById('btnStart');
  const lapsContainer = document.getElementById('lapsContainer');
  const ring = document.querySelector('.enso-progress');
  const circ = 2 * Math.PI * 105;
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ;

  function fmt(ms) {
    const t = Math.floor(ms / 1000);
    const s = t % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
    if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
  }

  function fmtFull(ms) {
    const t = Math.floor(ms / 1000);
    const s = t % 60, m = Math.floor(t / 60);
    return `${pad(m)}:${pad(s)}`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    if (!running) return;
    elapsed = performance.now() - startTime;
    display.textContent = fmt(elapsed);

    const t = Math.floor(elapsed / 1000);
    const h = Math.floor(t / 3600);
    if (h > 0) timeLabel.textContent = 'saat : dakika : saniye';
    else timeLabel.textContent = 'dakika : saniye';

    // Ring: 60 saniyede bir tur
    const frac = (elapsed % 60000) / 60000;
    ring.style.strokeDashoffset = circ * (1 - frac);

    animFrame = requestAnimationFrame(update);
  }

  function toggleTimer() {
    if (running) {
      running = false;
      cancelAnimationFrame(animFrame);
      statusBadge.className = 'status-badge paused';
      statusText.textContent = 'duraklatıldı';
      btnStart.textContent = 'Devam';
      btnStart.className = 'btn btn-start';
    } else {
      running = true;
      startTime = performance.now() - elapsed;
      statusBadge.className = 'status-badge running';
      statusText.textContent = 'çalışıyor';
      btnStart.textContent = 'Durdur';
      btnStart.className = 'btn btn-pause';
      update();
    }
  }

  function resetTimer() {
    running = false;
    cancelAnimationFrame(animFrame);
    elapsed = 0; lastLapTime = 0; laps = [];
    display.textContent = '00:00';
    timeLabel.textContent = 'dakika : saniye';
    statusBadge.className = 'status-badge';
    statusText.textContent = 'hazır';
    btnStart.textContent = 'Başlat';
    btnStart.className = 'btn btn-start';
    ring.style.strokeDashoffset = circ;
    lapsContainer.innerHTML = '';
  }

  function addLap() {
    if (!running) return;
    const diff = elapsed - lastLapTime;
    lastLapTime = elapsed;
    laps.push({ total: elapsed, diff });
    renderLaps();
  }

  function renderLaps() {
    lapsContainer.innerHTML = '';
    const diffs = laps.map(l => l.diff);
    const best = laps.length >= 2 ? Math.min(...diffs) : null;
    const worst = laps.length >= 2 ? Math.max(...diffs) : null;

    for (let i = laps.length - 1; i >= 0; i--) {
      const l = laps[i];
      let cls = '';
      if (laps.length >= 2) {
        if (l.diff === best) cls = 'best';
        else if (l.diff === worst) cls = 'worst';
      }
      lapsContainer.insertAdjacentHTML('beforeend',
        `<div class="lap-item ${cls}">
          <span class="lap-num">Tur ${i + 1}</span>
          <span class="lap-diff">+${fmtFull(l.diff)}</span>
          <span class="lap-time">${fmtFull(l.total)}</span>
        </div>`
      );
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
    else if (e.code === 'KeyL') addLap();
    else if (e.code === 'KeyR') resetTimer();
  });

  // ===== SAKURA PETALS =====
  const canvas = document.getElementById('sakuraCanvas');
  const ctx = canvas.getContext('2d');
  let petals = [];

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  class Petal {
    constructor() { this.reset(); this.y = Math.random() * canvas.height; }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -20;
      this.size = Math.random() * 8 + 5;
      this.speedY = Math.random() * 0.6 + 0.2;
      this.speedX = Math.random() * 0.4 - 0.2;
      this.rot = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.015 + 0.005;
      this.opacity = Math.random() * 0.25 + 0.08;
      const pinkVariant = Math.floor(Math.random() * 4);
      this.colors = [
        ['#f2d0d0', '#e8a0a0'],
        ['#f0c8c8', '#d4878e'],
        ['#f5dada', '#d4a0a0'],
        ['#ffe0e0', '#e0b0b0']
      ][pinkVariant];
    }
    update() {
      this.y += this.speedY;
      this.wobble += this.wobbleSpeed;
      this.x += this.speedX + Math.sin(this.wobble) * 0.4;
      this.rot += this.rotSpeed;
      if (this.y > canvas.height + 20) this.reset();
    }
    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.globalAlpha = this.opacity;
      ctx.beginPath();
      // Petal shape
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(
        this.size * 0.4, -this.size * 0.5,
        this.size, -this.size * 0.3,
        this.size * 0.5, this.size * 0.2
      );
      ctx.bezierCurveTo(
        this.size * 0.8, this.size * 0.6,
        this.size * 0.2, this.size * 0.7,
        0, 0
      );
      ctx.fillStyle = this.colors[0];
      ctx.fill();
      // İnner detail
      ctx.beginPath();
      ctx.moveTo(this.size * 0.15, this.size * 0.05);
      ctx.bezierCurveTo(
        this.size * 0.35, -this.size * 0.2,
        this.size * 0.6, -this.size * 0.05,
        this.size * 0.4, this.size * 0.2
      );
      ctx.fillStyle = this.colors[1];
      ctx.globalAlpha = this.opacity * 0.4;
      ctx.fill();
      ctx.restore();
    }
  }

  const petalCount = Math.min(35, Math.floor(innerWidth / 30));
  for (let i = 0; i < petalCount; i++) petals.push(new Petal());

  function animatePetals() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petals.forEach(p => { p.update(); p.draw(ctx); });
    requestAnimationFrame(animatePetals);
  }
  animatePetals();
</script>
</body>
</html>
